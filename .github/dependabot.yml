version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "@types/node"
        versions: ["<24", ">=25"]
    groups:
      vitest:
        patterns: ["vitest", "@vitest/*"]
      npm-dependencies:
        patterns: ["*"]
