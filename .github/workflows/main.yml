name: Test

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches:
      - main
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - id: test
        run: npm test
      - name: Report coverage
        if: always() && steps.test.outcome != 'skipped'
        uses: ./coverage-action
        with:
          path: coverage/cobertura-coverage.xml
          minimum_coverage: 75
          fail_below_threshold: true

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Validate build
        shell: bash
        run: |
          set -e
          npm ci --ignore-scripts
          git add -A
          npm run build
          if [ -n "$(git status --porcelain -- *-action/dist)" ]; then
            echo "::error::Build result differs. Run 'npm run build' then commit and push any changes"
            git status --porcelain -- *-action/dist
            exit 1
          fi

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
