name: Test

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches:
      - main
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage-action/coverage/cobertura-coverage.xml

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Validate build
        shell: bash
        run: |
          set -e
          npm ci --ignore-scripts
          git add -A
          npm run build
          if [ -n "$(git status --porcelain -- *-action/dist)" ]; then
            echo "::error::Build result differs. Run 'npm run build' then commit and push any changes"
            git status --porcelain -- *-action/dist
            exit 1
          fi
